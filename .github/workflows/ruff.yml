name: Ruff

on:
  push:
    branches:
      - main
  pull_request:
  # started by the `manuscript` workflow on the pull request it opens,
  # which GitHub does not start checks for
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
