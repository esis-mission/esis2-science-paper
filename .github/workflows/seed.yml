name: seed

# Give the cache of what the article computes a result computed elsewhere.
#
# Some of what the article computes takes hours on a runner of GitHub, such
# as the simulated image of the MURaM simulation. `joblib` looks a result up
# by the arguments and the source of its function, which are the same on
# every computer, so a result computed on a workstation answers a runner too,
# provided the workstation has the versions of the packages the runner
# installs.
#
# The results are an archive attached to a draft release, whose paths are
# relative to `~/.esis/cache`, such as `esis2_science_paper/_muram`. A draft
# is not public, and does not start the `overleaf` workflow. This workflow
# unpacks the archive beside the newest cache and saves the two as a new
# cache, on `main`, where every pull request can restore it.

on:
  workflow_dispatch:
    inputs:
      release:
        description: The draft release the archive is attached to.
        default: cache-seed
      archive:
        description: The name of the archive, a gzipped tar.
        default: seed.tar.gz

permissions:
  # a draft release is only shown to those who can write
  contents: write

jobs:
  seed:
    name: Seed the cache of what the article computes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the article
        id: setup
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      - name: Unpack the archive into the cache
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          ARCHIVE: ${{ inputs.archive }}
        # `--touch` dates each file now, since the `remember` action saves
        # the cache only if it holds a file newer than the one restored.
        run: |
          gh release download "$RELEASE" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP"
          mkdir -p ~/.esis/cache
          tar --extract --gzip --touch --verbose \
            --file "$RUNNER_TEMP/$ARCHIVE" --directory ~/.esis/cache
      - name: Remember what the article computed
        uses: ./.github/actions/remember
        with:
          key: ${{ steps.setup.outputs.cache-key }}
          paths: ${{ steps.setup.outputs.cache-paths }}
