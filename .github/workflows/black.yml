name: Black

on:
  push:
    branches:
      - main
  pull_request:
  # started by the `manuscript` workflow on the pull request it opens,
  # which GitHub does not start checks for
  workflow_dispatch:

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "--check --verbose --diff"
          src: "./esis2_science_paper"
