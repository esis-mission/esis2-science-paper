name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
        ]
        python-version: ["3.12", "3.13"]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} test
    steps:
      - uses: actions/checkout@v4
      # LaTeX, Python, this package, and the CHIANTI database and the
      # spectrum computed from it, which the `overleaf` workflow needs too.
      - name: Set up the article
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          extras: "[test]"
      - name: Test with pytest
        env:
          # Where the `pdf` workflow will publish this build: the root of the
          # site for `main`, and `pr/<number>/` for a pull request. The
          # captions of animated figures link to their movies there.
          ESIS_JET_PAPER_URL: >-
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.event_name == 'pull_request' && format('pr/{0}/', github.event.number) || '' }}
        run: |
          pip install pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload the article
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: article
          path: esis2_science_paper/build/esis2-science.pdf
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
