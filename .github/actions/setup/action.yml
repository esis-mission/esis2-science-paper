name: Set up the article
description: >-
  Install LaTeX, Python, and this package, and restore the CHIANTI database and
  what the article computed in earlier runs, which every build of the article
  needs. The `remember` action saves what this run computes.

inputs:
  python-version:
    description: The version of Python to install.
    required: true
  extras:
    description: The optional dependencies of this package to install, such as `[test]`.
    required: false
    default: ""

outputs:
  cache-key:
    description: The key the `remember` action saves what this run computes under.
    value: ${{ steps.computed.outputs.key }}
  cache-paths:
    description: The paths the cache of what the article computes holds.
    value: ${{ steps.computed.outputs.paths }}

runs:
  using: composite
  steps:
    - name: Install LaTeX
      # `apt-get` waits forever if another process on the runner holds the
      # dpkg lock, so bound that wait and answer its prompts non-interactively.
      # The index the runner ships with goes stale, and installing against a
      # stale one asks the mirror for versions it has since replaced.
      shell: bash
      run: >-
        sudo apt-get update -o DPkg::Lock::Timeout=300 &&
        sudo apt-get install -y -o DPkg::Lock::Timeout=300
        texlive-publishers texlive-science cm-super latexmk libcairo2-dev
        dvipng
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install package
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".${{ inputs.extras }}"
    # The article reads the CHIANTI atomic database for the emission measure
    # of an active region and for the version it names in a caption, and to
    # compute the lines of the passband. The database is several gigabytes
    # and the lines take a quarter of an hour, so both are cached, and the
    # second is keyed on the first: a spectrum computed from one version of
    # the database must not be served beside another.
    - name: Ask fiasco which database it wants
      id: chianti
      shell: bash
      run: |
        python -c "
        from fiasco.util.setup_db import LATEST_VERSION
        print(f'version={LATEST_VERSION}')
        " >> $GITHUB_OUTPUT
    - name: Restore the CHIANTI database
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.fiasco
        key: chianti-${{ steps.chianti.outputs.version }}
    - name: Download and build the CHIANTI database
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -c "
        import fiasco
        from fiasco.util import check_database
        check_database(
            hdf5_dbase_root=fiasco.defaults['hdf5_dbase_root'],
            ascii_dbase_root=fiasco.defaults['ascii_dbase_root'],
            ask_before=False,
            show_progress=False,
        )
        "
    # What the article computes is cached as well: the spectrum, the
    # effective area, and the simulated image this package remembers, the
    # contribution functions of the scene of that image, which `esis`
    # remembers and which take a quarter of an hour of their own, and the
    # AIA images the scene is made from, with the searches which found them.
    # The images come from the JSOC, which now and then does not answer a
    # runner in time, so a run which restores them does not ask it. Only the
    # Level 1 images are cached, named as files, since a pattern which names
    # a directory caches all of it: sdo prepares the Level 1.5 images beside
    # them without the JSOC, and each is several times the size.
    #
    # `joblib` keys each result on the versions of the packages which
    # computed it, so a release of any of them leaves the cache holding the
    # answer to an old question. A fixed key would still hit, and
    # `actions/cache` would decline to save what the run recomputed, so
    # every run after the release would pay for it again. Instead the cache
    # rolls: each run restores the newest one saved under the version of
    # CHIANTI, and the `remember` action saves a new one under a key of its
    # own if the run computed anything. `joblib` decides for itself whether
    # what was restored still answers the question.
    - name: Name the cache of what the article computes
      id: computed
      shell: bash
      env:
        PATHS: |
          ~/.esis/cache/esis2_science_paper
          ~/.esis/cache/esis/data/synth/_scene_dem
          ~/.sdo/cache/SUM*/**/image_lev1.fits
          ~/.sdo/cache/sdo/aia/_data/_urls
        PREFIX: computed-${{ steps.chianti.outputs.version }}-
      run: |
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.python-version }}" >> "$GITHUB_OUTPUT"
        {
          echo "paths<<EOF"
          echo "$PATHS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Restore what the article computed in an earlier run
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.computed.outputs.paths }}
        key: ${{ steps.computed.outputs.key }}
        restore-keys: ${{ steps.computed.outputs.prefix }}
    # The `remember` action saves the cache only if a file in it is newer
    # than this, which is newer than every file restored.
    - name: Mark the time the cache was restored
      shell: bash
      run: touch "$RUNNER_TEMP/computed-restored"
