[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "esis2-science-paper"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "An AAS journal article describing the science motivation, instrument, and inversions of test data for the second flight of the EUV Snapshot Imaging Spectrograph (ESIS-II)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pylatex~=1.4",
    "aastex~=0.9",
    "matplotlib",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pymupdf",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
    "ipykernel",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/esis-mission/esis2-science-paper"

[tool.setuptools.packages.find]
include = ["esis2_science_paper*"]

[tool.setuptools.package-data]
esis2_science_paper = ["*.bib"]

[tool.setuptools_scm]
